<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Не сделано · А/Б</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Прототип А/Б экрана «Не сделано» по макету Figma «[Design 116] Успеваемость 2.1».
     А — с шевроном (2450:91631): по умолчанию все курсы свёрнуты, раскрываются по нажатию.
     Б — без шеврона (2450:92448): все курсы развёрнуты, до 3 задач в каждом. */
  :root {
    color-scheme: light;
    --text-primary: #1f2532;
    --text-tertiary: #9ba3b3;
    --brand: #47629f;
    --brand-medium: #5c79b7;
    --surface: #ffffff;
    --surface-brand-subtle: #f4f7fc;
    --surface-brand-medium: #e8effc;
    --surface-neutral-medium: #f5f6f9;
    --border: #dde3ef;
    --border-brand: #8faff1;
    --font: "Wix Madefor Text", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease: cubic-bezier(0, 0, .58, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: #e9ecf2;
    color: var(--text-primary);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  p { margin: 0; }
  img { display: block; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }

  /* ---------- телефон ---------- */
  .phone {
    width: 375px; min-height: 812px;
    margin: 24px auto 96px;
    background: var(--surface);
    border-radius: 32px;
    box-shadow: 0 8px 40px rgba(31, 37, 50, .12);
    overflow: hidden;
    position: relative;
  }
  @media (max-width: 480px) {
    body { background: var(--surface); }
    .phone { width: 100%; min-height: 100vh; margin: 0; border-radius: 0; box-shadow: none; padding-bottom: 80px; }
    .systembar { display: none !important; }
  }

  .systembar {
    height: 44px; padding: 0 32px 0 50px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .systembar .time { font: 600 18px/1 -apple-system, "SF Pro Display", system-ui, sans-serif; letter-spacing: -.36px; }
  .systembar .icons { display: flex; gap: 6px; align-items: center; }

  .topbar { position: sticky; top: 0; z-index: 2; background: var(--surface); }
  .appbar { height: 48px; padding: 0 16px; display: flex; align-items: center; }
  .appbar button { width: 24px; height: 24px; }

  .main { padding: 8px 16px 32px; display: flex; flex-direction: column; gap: 20px; }
  .head { display: flex; flex-direction: column; gap: 16px; }
  .title { font-weight: 600; font-size: 17px; line-height: 24px; color: var(--brand); }

  .segmented { display: flex; gap: 4px; padding: 2px; border-radius: 100px; background: var(--surface-brand-subtle); }
  .segment {
    flex: 1; padding: 8px 16px; border-radius: 100px;
    text-align: center; font-weight: 600; font-size: 12px; line-height: 16px; color: var(--brand);
    transition: background .15s, color .15s;
  }
  .segment[aria-selected="true"] { background: var(--brand-medium); color: #fff; }

  .chips { display: flex; gap: 8px; margin: 0 -16px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: flex; align-items: center; gap: 8px;
    min-width: 36px; padding: 3px 12px 5px; border-radius: 100px;
    font-size: 12px; line-height: 16px;
    background: var(--surface-neutral-medium); color: var(--text-tertiary);
  }
  .chip.active { background: var(--surface-brand-medium); color: var(--brand); }

  /* ---------- список ---------- */
  .section { border-bottom: 1px solid var(--border); padding: 16px 0; }
  .section:first-child { padding-top: 0; }
  .section-header { display: flex; gap: 8px; align-items: flex-start; width: 100%; }
  .section-title { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; line-height: 20px; color: var(--brand); }
  .chev { flex: none; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  .chev .ic-open { display: none; transform: rotate(180deg); }
  .section.open .chev .ic-open { display: block; }
  .section.open .chev .ic-closed { display: none; }

  .collapse { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .24s var(--ease); }
  .collapse > .inner { overflow: hidden; min-height: 0; }
  .variant-a .section:not(.open) .collapse { grid-template-rows: 0fr; }

  .rows { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
  .row { display: flex; gap: 12px; align-items: center; width: 100%; }
  .row:active .row-title { color: var(--brand); }
  .row[hidden] { display: none; }
  .date {
    flex: none; width: 44px; height: 44px; padding: 4px; border-radius: 8px;
    background: var(--surface-brand-subtle);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 12px; line-height: 16px; white-space: nowrap;
  }
  .date.progress { border: 1px dashed var(--border-brand); }
  .date .d { font-weight: 600; color: var(--brand); }
  .date .t { color: var(--text-tertiary); }
  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 12px; line-height: 16px; }
  .row-subject { color: var(--text-tertiary); }
  .row-title { color: var(--text-primary); font-size: 14px; line-height: 20px; }
  .row-status { color: var(--text-tertiary); }

  .more { padding-left: 56px; }
  .more button { font-size: 14px; line-height: 20px; color: var(--brand); border-radius: 8px; }

  .flat { display: flex; flex-direction: column; gap: 8px; }

  /* ---------- служебное: переключатель А/Б и тост ---------- */
  .ab {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 10;
    display: flex; gap: 2px; padding: 3px; border-radius: 100px;
    background: rgba(31, 37, 50, .88); box-shadow: 0 4px 16px rgba(0,0,0,.2);
  }
  .ab button { padding: 8px 14px; border-radius: 100px; color: #c9cfdb; font-size: 13px; line-height: 16px; font-weight: 600; white-space: nowrap; }
  .ab button[aria-pressed="true"] { background: #fff; color: var(--text-primary); }

  .toast {
    position: fixed; left: 50%; bottom: 72px; transform: translate(-50%, 12px); z-index: 11;
    max-width: calc(100% - 32px); width: max-content;
    padding: 10px 16px; border-radius: 12px; background: var(--text-primary); color: #fff;
    font-size: 13px; line-height: 18px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="systembar" aria-hidden="true">
    <span class="time">19:02</span>
    <span class="icons">
      <img src="assets/sb-reception.svg" width="18" height="11" alt="">
      <img src="assets/sb-wifi.svg" width="18" height="13" alt="">
      <img src="assets/sb-battery.svg" width="27" height="13" alt="">
    </span>
  </div>
  <div class="topbar">
    <div class="appbar">
      <button type="button" aria-label="Назад"><img src="assets/arrow-back.svg" width="24" height="24" alt=""></button>
    </div>
  </div>

  <main class="main">
    <div class="head">
      <p class="title">Непросмотренные уроки&nbsp;·&nbsp;<span id="count"></span></p>
      <div class="segmented" role="tablist">
        <button type="button" class="segment" role="tab" data-mode="course" aria-selected="true">По курсам</button>
        <button type="button" class="segment" role="tab" data-mode="date" aria-selected="false">По дате</button>
      </div>
      <div class="chips">
        <span class="chip active">За всё время</span>
        <span class="chip">Неделя <img src="assets/chip-chevron.svg" width="16" height="16" alt=""></span>
        <span class="chip">Месяц <img src="assets/chip-chevron.svg" width="16" height="16" alt=""></span>
        <span class="chip">Свой период <img src="assets/chip-calendar.svg" width="16" height="16" alt=""></span>
      </div>
    </div>
    <div id="list"></div>
  </main>
</div>

<div class="ab" role="group" aria-label="Вариант прототипа">
  <button type="button" data-variant="a">А · с шевроном</button>
  <button type="button" data-variant="b">Б · без шеврона</button>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
  const LIMIT = 3;

  // Порядок курсов — как в макете. status: строка под названием; progress: пунктирная плашка.
  const COURSES = [
    { title: "Курс по английскому языку. Подготовка к экзамену по международной сертификации в центре Language Link 6 класс",
      subject: "Английский язык",
      tasks: [
        { d: "03.09", t: "15:15", name: "Unit 1. Present Simple и Present Continuous" },
        { d: "10.09", t: "15:15", name: "Unit 2. Описание внешности и характера", status: "Не просмотрен · 28%", progress: true },
        { d: "17.09", t: "15:15", name: "Unit 3. Past Simple: правильные и неправильные глаголы" },
        { d: "24.09", t: "15:15", name: "Unit 4. Future Simple и конструкция be going to" },
        { d: "01.10", t: "15:15", name: "Unit 5. Сравнительная степень прилагательных" },
      ] },
    { title: "Курс по биологии. Ботаника: растительный организм. 6 класс",
      subject: "Биология",
      tasks: [
        { d: "08.09", t: "15:15", name: "Урок № 2. Строение растительной клетки" },
        { d: "15.09", t: "15:15", name: "Урок № 4. Ткани растений" },
        { d: "22.09", t: "15:15", name: "Урок № 6. Корень: строение и функции" },
      ] },
    { title: "Курс по истории. 6 класс",
      subject: "История",
      tasks: [
        { d: "02.09", t: "12:30", name: "§ 2. Первобытные люди и их открытия" },
        { d: "16.09", t: "12:30", name: "§ 4. Древний Египет: государство и общество" },
      ] },
    { title: "Курс по географии. 6 класс",
      subject: "География",
      tasks: [
        { d: "07.09", t: "11:00", name: "Урок 3. Литосфера и рельеф Земли" },
        { d: "14.09", t: "11:00", name: "Урок 4. Гидросфера: Мировой океан" },
      ] },
    { title: "Курс по литературе. 6 класс",
      subject: "Литература",
      tasks: [
        { d: "05.09", t: "13:45", name: "Урок 2. Мифы Древней Греции" },
        { d: "19.09", t: "13:45", name: "Урок 4. А. С. Пушкин «Дубровский»" },
      ] },
    { title: "Курс по математике. Повышенный уровень. 6 класс",
      subject: "Математика",
      tasks: [
        { d: "04.09", t: "10:00", name: "§ 2. Делители и кратные" },
        { d: "11.09", t: "10:00", name: "§ 3. Признаки делимости" },
        { d: "18.09", t: "10:00", name: "§ 4. Наибольший общий делитель" },
      ] },
  ];

  const state = {
    variant: "a",
    mode: "course",
    open: new Set(),      // раскрытые курсы (вариант А)
    showAll: new Set(),   // курсы, где нажали «Показать ещё»
  };

  const escRaw = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // Типограф: неразрывные пробелы, чтобы не было висячих предлогов, союзов и разорванных «6 класс», «№ 2», «§ 2», «А. С. Пушкин», «· 28%».
  const NB = "\u00a0";
  function typo(s) {
    return s
      .replace(/(^|[\s(«])([А-Яа-яЁёA-Za-z]{1,2}|для|без|под|над|при|про|из-за|что|как|или)\s+/g, (m, a, w) => a + w + NB) // короткие слова и предлоги
      .replace(/(^|[\s(«])([А-Яа-яЁёA-Za-z]{1,2}|для|без|под|над|при|про|из-за|что|как|или)\s+/g, (m, a, w) => a + w + NB) // повтор для подряд идущих
      .replace(/([№§])\s+/g, "$1" + NB)                     // № 2, § 2
      .replace(/(\d)\s+(класс|кл\.)/g, "$1" + NB + "$2")       // 6 класс
      .replace(/(^|[\s\u00a0])([А-ЯA-Z]\.)\s+(?=[А-ЯA-Z])/g, "$1$2" + NB)   // А. С. Пушкин
      .replace(/\s+·\s+/g, NB + "· ")                           // слово · 28%
      .replace(/·\s+(\d+%?)$/, "·" + NB + "$1");                // · 2 в конце
  }
  const esc = s => escRaw(typo(s));
  const key = d => d.split(".").reverse().join("");

  function rowHTML(task, subject, hidden) {
    return `<button type="button" class="row" data-name="${esc(task.name)}"${hidden ? " hidden" : ""}>
      <span class="date${task.progress ? " progress" : ""}"><span class="d">${task.d}</span><span class="t">${task.t}</span></span>
      <span class="content">
        ${subject ? `<span class="row-subject">${esc(subject)}</span>` : ""}
        <span class="row-title">${esc(task.name)}</span>
        ${task.status ? `<span class="row-status">${esc(task.status)}</span>` : ""}
      </span>
    </button>`;
  }

  function renderByCourse() {
    const isA = state.variant === "a";
    return COURSES.map((c, i) => {
      const all = state.showAll.has(i);
      const extra = c.tasks.length - LIMIT;
      const rows = c.tasks.map((t, j) => rowHTML(t, null, !all && j >= LIMIT)).join("");
      const more = extra > 0
        ? `<div class="more"><button type="button" data-more="${i}">${all ? "Скрыть" : esc(`Показать ещё · ${extra}`)}</button></div>` : "";
      const header = isA
        ? `<button type="button" class="section-header" data-toggle="${i}" aria-expanded="${state.open.has(i)}">
             <span class="section-title">${esc(c.title)}</span>
             <span class="chev">
               <img class="ic-closed" src="assets/arrow-down-16.svg" width="16" height="16" alt="">
               <img class="ic-open" src="assets/chevron-20.svg" width="20" height="20" alt="">
             </span>
           </button>`
        : `<div class="section-header"><p class="section-title">${esc(c.title)}</p></div>`;
      return `<section class="section${isA && state.open.has(i) ? " open" : ""}">
        ${header}
        <div class="collapse"><div class="inner"><div class="rows">${rows}${more}</div></div></div>
      </section>`;
    }).join("");
  }

  function renderByDate() {
    const all = COURSES.flatMap(c => c.tasks.map(t => ({ ...t, subject: c.subject })));
    all.sort((a, b) => key(a.d).localeCompare(key(b.d)));
    return `<div class="flat">${all.map(t => rowHTML(t, t.subject, false)).join("")}</div>`;
  }

  function render() {
    document.body.className = `variant-${state.variant}`;
    document.getElementById("count").textContent = COURSES.reduce((n, c) => n + c.tasks.length, 0);
    document.querySelectorAll(".segment").forEach(b => b.setAttribute("aria-selected", b.dataset.mode === state.mode));
    document.querySelectorAll(".ab button").forEach(b => b.setAttribute("aria-pressed", b.dataset.variant === state.variant));
    document.getElementById("list").innerHTML = state.mode === "course" ? renderByCourse() : renderByDate();
  }

  function setVariant(v) {
    state.variant = v;
    state.mode = "course";
    state.open.clear();
    state.showAll.clear();
    const url = new URL(location.href);
    url.searchParams.set("v", v);
    history.replaceState(null, "", url);
    render();
    window.scrollTo(0, 0);
  }

  let toastTimer;
  function toast(text) {
    const el = document.getElementById("toast");
    el.textContent = text;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
  }

  document.addEventListener("click", e => {
    const t = e.target.closest("[data-toggle],[data-more],.row,.segment,.ab button");
    if (!t) return;
    if (t.dataset.toggle != null) {
      const i = +t.dataset.toggle;
      const section = t.closest(".section");
      state.open.has(i) ? state.open.delete(i) : state.open.add(i);
      section.classList.toggle("open", state.open.has(i));
      t.setAttribute("aria-expanded", state.open.has(i));
    } else if (t.dataset.more != null) {
      const i = +t.dataset.more;
      state.showAll.has(i) ? state.showAll.delete(i) : state.showAll.add(i);
      const all = state.showAll.has(i);
      const section = t.closest(".section");
      section.querySelectorAll(".row").forEach((r, j) => { r.hidden = !all && j >= LIMIT; });
      t.textContent = all ? "Скрыть" : typo(`Показать ещё · ${COURSES[i].tasks.length - LIMIT}`);
    } else if (t.classList.contains("row")) {
      toast(`Открываем урок: ${t.dataset.name}`);
    } else if (t.classList.contains("segment")) {
      state.mode = t.dataset.mode;
      render();
    } else if (t.dataset.variant) {
      setVariant(t.dataset.variant);
    }
  });

  const v = new URLSearchParams(location.search).get("v");
  setVariant(v === "b" ? "b" : "a");
</script>
</body>
</html>
